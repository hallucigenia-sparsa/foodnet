name: release

# Runs only when a maintainer pushes a version tag (v0.1.0, ...). It checks the tag against the version and
# the changelog, builds and tests everything, publishes to PyPI through trusted publishing (no password or
# token is stored anywhere), and creates the GitHub release with the Windows program attached. The one-time
# setup and the steps are in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python packaging/check_release.py "$GITHUB_REF_NAME" notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md

  dist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  install:
    # the built wheel, installed as a user would, on each platform
    needs: dist
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: install the wheel into a clean environment and open the page
        shell: bash
        run: |
          python -m venv clean
          if [ -d clean/Scripts ]; then bin=clean/Scripts; else bin=clean/bin; fi
          "$bin/python" -m pip install dist/*.whl
          "$bin/foodnet" --help
          python packaging/smoke.py "$bin/foodnet" gui --no-browser

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3 .
      - name: build the program and zip it (the tag reaches the shell as a variable, never as code)
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: python packaging/windows/build.py "foodnet-$TAG-windows.zip"
      - run: python packaging/smoke.py dist/foodnet/foodnet.exe --no-browser
      - run: dist/foodnet/foodnet.exe validate tests/fixtures/example_network.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: foodnet-${{ github.ref_name }}-windows.zip

  pypi:
    # trusted publishing: PyPI accepts this job's short-lived GitHub identity, set up once (RELEASING.md).
    # The pypi environment can require a maintainer's approval before this job runs.
    needs: [install, windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: create the release with the notes from CHANGELOG.md and every file attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "foodnet $GITHUB_REF_NAME"
          --notes-file artifacts/notes/notes.md artifacts/dist/* artifacts/windows/*.zip
