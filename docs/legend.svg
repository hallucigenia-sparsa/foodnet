<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" role="img" aria-label="foodnet legend"><rect width="900" height="594" fill="#ffffff"/><text x="20" y="35" font-size="15" font-weight="600" fill="#1F1D1A" font-family="system-ui, sans-serif">Nodes</text><circle cx="95" cy="64" r="12" fill="#E87BA4" stroke="#615B53"/><text x="190" y="69" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">taxon (a strain, or a genus after merging), colored by genus</text><rect x="83" y="86" width="24" height="24" rx="5" fill="#E7E1D6" stroke="#615B53"/><text x="190" y="103" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">metabolite, by ChEBI id</text><text x="20" y="143" font-size="15" font-weight="600" fill="#1F1D1A" font-family="system-ui, sans-serif">Arcs (width: the amount in mM)</text><g opacity="1.0"><line x1="40" y1="172" x2="150" y2="172" stroke="#2160A8" stroke-width="3.0"/><path d="M 162 172 L 148 165 L 148 179 z" fill="#2160A8"/></g><text x="190" y="177" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">produced: from the taxon to the metabolite, which rose in its monoculture</text><g opacity="1.0"><line x1="40" y1="206" x2="150" y2="206" stroke="#B45309" stroke-width="3.0"/><path d="M 162 206 L 148 199 L 148 213 z" fill="#B45309"/></g><text x="190" y="211" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">consumed: from the metabolite to the taxon, the metabolite fell</text><g opacity="1.0"><line x1="40" y1="240" x2="150" y2="240" stroke="#615B53" stroke-width="3.0" stroke-dasharray="12 7"/><path d="M 162 240 L 148 233 L 148 247 z" fill="#615B53"/></g><text x="190" y="245" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">presence_only: seen in another medium, so its direction counts and not its size</text><g opacity="1.0"><line x1="40" y1="274" x2="150" y2="274" stroke="#615B53" stroke-width="3.0" stroke-dasharray="2 5"/><path d="M 162 274 L 148 267 L 148 281 z" fill="#615B53"/></g><text x="190" y="279" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">measured in one replicate (single_replicate)</text><g opacity="1.0"><line x1="40" y1="308" x2="150" y2="308" stroke="#615B53" stroke-width="3.0"/><path d="M 162 308 L 148 301 L 148 315 z" fill="#615B53"/></g><text x="190" y="313" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">measured: a mean change beyond the detection limit, in the medium values come from</text><g opacity="0.45"><line x1="40" y1="342" x2="150" y2="342" stroke="#2160A8" stroke-width="3.0"/><path d="M 162 342 L 148 335 L 148 349 z" fill="#2160A8"/></g><text x="190" y="347" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">stationary phase (fainter); exponential phase and a time window are drawn full</text><text x="20" y="387" font-size="15" font-weight="600" fill="#1F1D1A" font-family="system-ui, sans-serif">Cautions (an arc column; the arc is shown)</text><text x="40" y="413" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">single_replicate: one replicate, so no spread (dotted)</text><text x="40" y="439" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">short_record: metabolites recorded for less than 24 h</text><text x="40" y="465" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">window_beyond_data: the phase or window ends after the last metabolite sample; that sample stands in</text><text x="40" y="491" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">stationary_not_reached: the culture was still growing at its last sample: no stationary phase</text><text x="40" y="517" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">conflict: experiments pooled into this value disagree; the report names them</text><text x="40" y="543" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">not_detected_in_value_medium: seen in another medium, and measured without a change in the value medium</text><text x="40" y="569" font-size="15" font-weight="normal" fill="#1F1D1A" font-family="system-ui, sans-serif">phase_from_other_replicates: no growth curve in this replicate; its experiment&#x27;s median boundary is used</text></svg>
