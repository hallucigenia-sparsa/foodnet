name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows and macOS too: a Windows-only failure (a test connecting to itself) was found by hand on grownet #70
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: guardrail gate
        run: python checks/gate.py
      - name: tests
        run: pytest -q

  package:
    # the wheel and the source archive build, pass PyPI's checks, and a clean install serves the page (grownet #27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - name: install into a clean environment and open the page
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/foodnet --help
          python packaging/smoke.py /tmp/clean/bin/foodnet gui --no-browser

  r-package:
    # the R companion package in r/, checked the way CRAN does (grownet #112). R and its two dependencies come from
    # Ubuntu's own packages, so this adds no third-party action and nothing is compiled: r-cran-jsonlite is
    # what the package imports, r-cran-testthat is what runs its tests inside the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install R, jsonlite and testthat
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite r-cran-testthat
          R --version | head -1
      - name: build and check the package
        # the suggested packages (miaSim) are not installed here: it is only named in examples that do not
        # run, so the check must not demand it
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          R CMD build r
          R CMD check --no-manual foodnet_*.tar.gz
          # a WARNING (an export without a help page, say) fails too: R CMD check exits 0 on one (a review)
          if grep -q "^Status:.*WARNING" foodnet.Rcheck/00check.log; then exit 1; fi
      - name: show the check log when it fails
        if: failure()
        run: cat foodnet.Rcheck/00check.log || true

  windows-app:
    # the self-contained Windows program: a one-folder build in a zip (Karoline, on grownet #63), built and started
    # on a Windows machine, so every change proves it still works (grownet #26)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3 .
      - name: build the one-folder program and zip it
        run: python packaging/windows/build.py foodnet-windows.zip
      - name: start it and open the page
        run: python packaging/smoke.py dist/foodnet/foodnet.exe --no-browser
      - name: run the command line from it, offline (validate the example network)
        run: dist/foodnet/foodnet.exe validate tests/fixtures/example_network.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foodnet-windows
          path: foodnet-windows.zip
          retention-days: 14
